spring.application.name=weill

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/weill-db}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

weill.admin.email=${ADMIN_EMAIL:admin@weill.local}
weill.admin.password=${ADMIN_PASSWORD:WeillAdmin2026!}
weill.dean.email=${DEAN_EMAIL:decana@weill.local}
weill.dean.password=${DEAN_PASSWORD:WeillDecana2026!}
weill.technical-admin.email=${TECHNICAL_ADMIN_EMAIL:tecnico@weill.local}
weill.technical-admin.password=${TECHNICAL_ADMIN_PASSWORD:WeillTecnico2026!}
