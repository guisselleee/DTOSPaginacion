<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test de inteligencia de Weill</title>
    <link rel="stylesheet" href="/css/weill.css">
</head>
<body>
<main class="start-shell">
    <section class="start-panel">
        <p class="eyebrow">Test de inteligencia de Weill</p>
        <h1 th:text="'Hola, ' + ${user.displayName}">Hola, participante</h1>
        <p class="lead-copy">Cuando estés listo, inicia una nueva prueba.</p>
        <dl class="user-summary">
            <div>
                <dt>Correo</dt>
                <dd th:text="${user.email}">correo@ejemplo.com</dd>
            </div>
            <div>
                <dt>Centro escolar</dt>
                <dd th:text="${user.schoolCenter ?: 'No registrado'}">No registrado</dd>
            </div>
            <div>
                <dt>Municipio</dt>
                <dd th:text="${user.municipality ?: 'No registrado'}">No registrado</dd>
            </div>
        </dl>
        <div class="form-actions">
            <form method="post" action="/attempts">
                <button class="primary-action" type="submit">Iniciar prueba</button>
            </form>
            <form method="post" action="/logout">
                <button class="secondary-action" type="submit">Salir</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
