<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test de Weill</title>
    <link rel="stylesheet" href="/css/weill.css">
    <script src="/js/weill-test.js" defer></script>
</head>
<body>
<header class="app-header">
    <div>
        <p class="eyebrow">Participante</p>
        <h1 th:text="${attempt.user.displayName}">Participante</h1>
    </div>
    <div class="progress-panel" aria-live="polite">
        <span><strong data-answered-count>0</strong>/<span th:text="${totalItems}">60</span> respondidas</span>
        <span>Tiempo transcurrido: <strong data-elapsed-time>00:00:00</strong></span>
    </div>
</header>

<main class="test-shell"
      th:attr="data-attempt-id=${attempt.id},data-total-items=${totalItems},data-started-at=${attempt.startedAt}">
    <section class="single-test-card" aria-live="polite">
        <div class="page-heading">
            <h2 data-current-title>Prueba 1</h2>
            <span><strong data-current-item>1</strong>/<span th:text="${totalItems}">60</span></span>
        </div>

        <div class="single-item-frame" data-test-items>
            <th:block th:each="page : ${pages}">
                <article class="test-item"
                         th:each="item : ${page.items}"
                         th:attr="data-page=${item.pageNumber},data-row=${item.rowNumber},data-item=${item.itemNumber}">
                <div class="item-title">
                    <h3 th:text="'Fila ' + ${item.rowNumber} + ' · Item ' + ${item.itemNumber}">Fila 1 · Item 1</h3>
                    <output data-selection-label>Sin respuesta</output>
                </div>

                <div class="target-stage">
                    <img class="target-image" th:src="${item.targetImagePath}" alt="Imagen principal del item">
                    <div class="drop-zone"
                         data-dropzone
                         aria-label="Zona de respuesta"
                         th:style="'left:' + ${item.dropZone.left} + '%;top:' + ${item.dropZone.top} + '%;width:' + ${item.dropZone.width} + '%;height:' + ${item.dropZone.height} + '%'"></div>
                </div>

                <div class="option-tray" aria-label="Opciones de respuesta">
                    <button class="option-tile"
                            type="button"
                            th:each="option : ${item.options}"
                            th:attr="data-option=${option.optionNumber}"
                            th:aria-label="'Opción ' + ${option.optionNumber}">
                        <img th:src="${option.imagePath}" alt="">
                    </button>
                </div>
                </article>
            </th:block>
        </div>
    </section>

    <div class="action-bar">
        <p data-status-message>Arrastra una opción al recuadro punteado para registrar la respuesta.</p>
        <div class="action-buttons">
            <button type="button" class="primary-action" data-finish-test>Finalizar y calificar</button>
        </div>
    </div>
</main>
</body>
</html>
