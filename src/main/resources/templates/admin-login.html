<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso institucional</title>
    <link rel="stylesheet" href="/css/weill.css">
</head>
<body>
<main class="start-shell">
    <section class="start-panel">
        <p class="eyebrow">Sistema Weill</p>
        <h1>Acceso institucional</h1>
        <p class="lead-copy">Ingreso para licenciados, decana y administración técnica.</p>
        <p class="form-error" th:if="${error}" th:text="${error}">Error</p>
        <form class="start-form" method="post" action="/admin/login">
            <label>
                Correo electrónico
                <input name="email"
                       type="email"
                       autocomplete="username"
                       required
                       maxlength="254"
                       placeholder="correo@institucion.edu"
                       th:value="${email}">
            </label>
            <label>
                Contraseña
                <input name="password"
                       type="password"
                       autocomplete="current-password"
                       required>
            </label>
            <button type="submit">Entrar</button>
        </form>
        <p class="form-footer">
            <a href="/login">Volver al ingreso de participantes</a>
        </p>
    </section>
</main>
</body>
</html>
