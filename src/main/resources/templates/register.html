<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro para el test de Weill</title>
    <link rel="stylesheet" href="/css/weill.css">
</head>
<body>
<main class="start-shell">
    <section class="start-panel">
        <p class="eyebrow">Test de inteligencia de Weill</p>
        <h1>Registro de usuario</h1>
        <p class="lead-copy">Completa tus datos para crear el acceso al sistema.</p>
        <p class="form-error" th:if="${error}" th:text="${error}">Error</p>
        <form class="start-form registration-form" method="post" action="/register" th:object="${registration}">
            <label>
                Nombre
                <input th:field="*{name}" type="text" autocomplete="name" required maxlength="160" placeholder="Nombre completo">
            </label>
            <label>
                Email
                <input th:field="*{email}" type="email" autocomplete="email" required maxlength="254" placeholder="correo@ejemplo.com">
            </label>
            <label>
                Escolaridad
                <input th:field="*{educationLevel}" type="text" required maxlength="120" placeholder="Grado o nivel educativo">
            </label>
            <label>
                Centro escolar
                <input th:field="*{schoolCenter}" type="text" required maxlength="180" placeholder="Nombre del centro escolar">
            </label>
            <label>
                Municipio
                <input th:field="*{municipality}" type="text" required maxlength="120" placeholder="Municipio">
            </label>
            <label>
                Departamento
                <input th:field="*{department}" type="text" required maxlength="120" placeholder="Departamento">
            </label>
            <label>
                Fecha de nacimiento
                <input th:field="*{birthDate}" type="date" required>
            </label>
            <fieldset class="radio-group">
                <legend>¿Actualmente estudia?</legend>
                <label>
                    <input th:field="*{currentlyStudying}" type="radio" value="true" required>
                    Sí
                </label>
                <label>
                    <input th:field="*{currentlyStudying}" type="radio" value="false" required>
                    No
                </label>
            </fieldset>
            <button type="submit">Crear registro</button>
        </form>
        <p class="form-footer">
            ¿Ya tienes registro?
            <a href="/login">Entrar con correo</a>
        </p>
    </section>
</main>
</body>
</html>
