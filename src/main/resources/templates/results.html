<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultados del test de Weill</title>
    <link rel="stylesheet" href="/css/weill.css">
</head>
<body>
<main class="results-shell">
    <section class="results-summary">
        <p class="eyebrow">Resultado</p>
        <h1 th:text="${result.attempt.user.displayName}">Participante</h1>
        <dl class="result-metrics">
            <div>
                <dt>Edad</dt>
                <dd th:text="${psychometric.age} + ' años'">10 años</dd>
            </div>
            <div>
                <dt>Grupo poblacional</dt>
                <dd th:text="${psychometric.populationCategory.displayName}">Niño</dd>
            </div>
            <div>
                <dt>Aciertos</dt>
                <dd th:text="${psychometric.correctAnswers} + '/' + ${maxScore}">50/60</dd>
            </div>
            <div>
                <dt>Percentil</dt>
                <dd th:text="${psychometric.percentile}">90</dd>
            </div>
            <div>
                <dt>Coeficiente intelectual (CI)</dt>
                <dd th:text="${psychometric.intelligenceQuotient}">119</dd>
            </div>
            <div>
                <dt>Interpretación</dt>
                <dd th:text="${psychometric.interpretation.displayName}">Buena inteligencia</dd>
            </div>
        </dl>
        <a class="secondary-link" href="/">Nueva prueba</a>
    </section>

    <section class="response-table-section">
        <h2>Detalle</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>Página</th>
                    <th>Fila</th>
                    <th>Item</th>
                    <th>Seleccionada</th>
                    <th>Correcta</th>
                    <th>Punto</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="response : ${result.responses}">
                    <td th:text="${response.pageNumber}">1</td>
                    <td th:text="${response.rowNumber}">1</td>
                    <td th:text="${response.itemNumber}">1</td>
                    <td th:text="${response.selectedOption}">1</td>
                    <td th:text="${response.correctOption}">1</td>
                    <td>
                        <span th:classappend="${response.correct} ? ' good' : ' bad'"
                              class="score-badge"
                              th:text="${response.score}">0</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
